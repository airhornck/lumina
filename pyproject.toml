[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lumina"
version = "0.2.0"
description = "Lumina AI 营销助手 — 多 Agent 中枢 + MCP Skill Hub + 统一对话入口"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.24.0",
    "litellm>=1.40.0",
    "python-dotenv>=1.0.0",
    "fastmcp>=3.0.0",
    "playwright>=1.40.0",
    "aiohttp>=3.9.0",
    "asyncpg>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pre-commit>=3.5.0",
]
# Hermes Agent 为唯一执行引擎。
# 底座已 vendor 钉版本于 vendor/hermes-agent/（0.16.0，见 LUMINA_PIN.md），
# 运行时由 apps/api/src/services/hermes_adapter.py 自动加入 sys.path，无需安装。
# Docker 环境通过 docker-compose 挂载 + PYTHONPATH 加载。
# hermes = [
#     "hermes-agent @ file:///path/to/hermes-agent",
# ]

[tool.setuptools.packages.find]
where = [
    "apps/api/src",
    "apps/orchestra/src",
    "apps/skill-hub/src",
    "apps/rpa/src",
    "packages/llm-hub/src",
    "packages/knowledge-base/src",
    "packages/lumina-skills/src",
    "packages/skill-hub-client/src",
    "packages/sop-engine/src",
    "packages/agent-core/src",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "real_llm: 需要调用真实 LLM API，消耗 token",
]
pythonpath = [
    "apps/api/src",
    "apps/orchestra/src",
    "apps/skill-hub/src",
    "apps/rpa/src",
    "packages/llm-hub/src",
    "packages/knowledge-base/src",
    "packages/lumina-skills/src",
    "packages/skill-hub-client/src",
    "packages/sop-engine/src",
    "packages/agent-core/src",
]
