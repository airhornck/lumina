<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lumina 对话调试</title>
    <link rel="stylesheet" href="styles.css?v=2" />
  </head>
  <body>
    <div class="app">
      <!-- 顶部导航栏 -->
      <header class="topbar">
        <div class="topbar-left">
          <div class="brand-mark">L</div>
          <span class="brand-name">Lumina</span>
          <span class="brand-sub">对话调试工作台</span>
        </div>
        <div class="topbar-right">
          <button type="button" class="btn-icon" id="btn-theme" title="切换主题">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
          <button type="button" class="btn-icon" id="btnTogglePanel" title="切换调试面板">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
          </button>
        </div>
      </header>

      <div class="layout">
        <!-- 左侧调试面板（可折叠） -->
        <aside class="debug-panel" id="debugPanel">
          <div class="panel-section">
            <h3>会话</h3>
            <div class="field-row">
              <label class="field">
                <span>User ID</span>
                <input type="text" id="userId" autocomplete="off" spellcheck="false" />
              </label>
              <label class="field">
                <span>对话 ID</span>
                <input type="text" id="convId" autocomplete="off" spellcheck="false" />
              </label>
            </div>
            <div class="btn-row">
              <button type="button" class="btn btn-sm" id="btnNewUser">新用户</button>
              <button type="button" class="btn btn-sm" id="btnNewConv">新对话</button>
            </div>
          </div>

          <div class="panel-section">
            <h3>服务</h3>
            <select id="service" class="select"></select>
            <label class="field hidden" id="positioningModeWrap">
              <span>定位模式</span>
              <select id="positioningMode" class="select">
                <option value="case">案例库 (case)</option>
                <option value="matrix">定位矩阵 (matrix)</option>
              </select>
            </label>
          </div>

          <div class="panel-section hidden" id="contextFieldWrap">
            <h3>上下文 JSON</h3>
            <textarea id="contextJson" rows="3" class="mono" placeholder='{"industry":"美妆"}'></textarea>
            <label class="check-row">
              <input type="checkbox" id="streamV2" checked />
              <span>SSE v2</span>
            </label>
          </div>

          <div class="panel-section">
            <h3>平台</h3>
            <input type="text" id="platform" placeholder="xiaohongshu / douyin …" class="input" />
          </div>

          <div class="panel-section">
            <div class="btn-row stack">
              <button type="button" class="btn btn-sm btn-outline-danger" id="btnClearMem">清空记忆</button>
              <button type="button" class="btn btn-sm btn-outline" id="btnRefreshMem">刷新记忆</button>
            </div>
          </div>
        </aside>

        <!-- 主对话区域 -->
        <main class="chat-area">
          <div class="messages" id="messages" aria-live="polite">
            <div class="load-earlier-wrap" id="loadEarlierWrap" style="display:none">
              <button type="button" class="btn btn-sm btn-outline" id="btnLoadEarlier">加载更早消息</button>
            </div>
          </div>

          <!-- 底部输入区 -->
          <div class="input-area">
            <!-- 快捷关键词标签 -->
            <div class="quick-tags" id="quickTags">
              <button type="button" class="tag" data-text="查爆款榜单">🔥 查爆款榜单</button>
              <button type="button" class="tag" data-text="内容定位矩阵">📊 内容定位矩阵</button>
              <button type="button" class="tag" data-text="生成本周快报">📋 生成本周快报</button>
            </div>
            <div class="input-box">
              <textarea
                id="input"
                rows="1"
                placeholder="输入消息… (Enter 发送, Shift+Enter 换行)"
              ></textarea>
              <div class="input-actions">
                <span class="status" id="status"></span>
                <button type="button" class="btn btn-primary" id="btnSend">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
                <button type="button" class="btn btn-outline" id="btnStop" disabled>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                </button>
              </div>
            </div>
          </div>
        </main>

        <!-- 右侧记忆面板 -->
        <aside class="mem-panel" id="memPanel">
          <div class="mem-head">
            <h3>记忆窗口</h3>
            <span class="badge" id="memCount">0 条</span>
          </div>
          <div class="mem-content">
            <pre class="mem-json" id="memJson">[]</pre>
          </div>
        </aside>
      </div>
    </div>
    <script src="/sdk/luminaChatClient.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
    <script src="app.js?v=6"></script>
  </body>
</html>
