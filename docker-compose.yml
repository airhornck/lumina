# 本地开发：挂载源码 + uvicorn --reload 热加载
# 用法：docker compose up --build
# 文档：docs/DOCKER_LOCAL.md
#
# 注意：Hermes Agent 为唯一执行引擎，挂载 vendor 钉版本目录（含 run_agent.py）。

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lumina-postgres
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-lumina}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-lumina123}"
      POSTGRES_DB: "${POSTGRES_DB:-lumina}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - lumina_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lumina} -d ${POSTGRES_DB:-lumina}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  lumina-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumina-api
    ports:
      - "${LUMINA_PORT:-8000}:8000"
    working_dir: /app
    volumes:
      # 整仓挂载：改 Python/静态页立即触发重载
      - .:/app
      # Hermes Agent 底座挂载（vendor 钉版本）
      - ${HERMES_AGENT_PATH:-./vendor/hermes-agent}:/app/hermes-agent:ro
      - lumina_hermes_data:/app/data/hermes
    env_file:
      - path: .env
        required: false
    environment:
      LLM_CONFIG_PATH: /app/infra/config/llm.yaml
      DATABASE_URL: "postgresql://${POSTGRES_USER:-lumina}:${POSTGRES_PASSWORD:-lumina123}@postgres:5432/${POSTGRES_DB:-lumina}"
      CHAT_MEMORY_BACKEND: "${CHAT_MEMORY_BACKEND:-postgres}"
      LUMINA_HERMES_MODEL: "${LUMINA_HERMES_MODEL:-deepseek-v4-flash}"
      LUMINA_HERMES_PROVIDER: "${LUMINA_HERMES_PROVIDER:-deepseek}"
      LUMINA_ENABLE_PROGRESSIVE_GENERATION: "${LUMINA_ENABLE_PROGRESSIVE_GENERATION:-true}"
      LUMINA_ENABLE_TASK_STATE: "${LUMINA_ENABLE_TASK_STATE:-true}"
      # Hermes 运行时依赖其仓库根目录在 PYTHONPATH 中
      PYTHONPATH: "/app/hermes-agent:/app/apps/api/src:/app/apps/orchestra/src:/app/apps/skill-hub/src:/app/apps/rpa/src:/app/packages/llm-hub/src:/app/packages/knowledge-base/src:/app/packages/lumina-skills/src:/app/packages/skill-hub-client/src:/app/packages/sop-engine/src:/app/packages/agent-core/src"
      # 在 Docker Desktop（尤其 Windows）下卷挂载时，强制轮询以便 --reload 稳定触发
      WATCHFILES_FORCE_POLLING: "${WATCHFILES_FORCE_POLLING:-true}"
    command:
      - uvicorn
      - api.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app
      - --app-dir
      - apps/api/src
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  lumina_postgres_data:
  lumina_hermes_data:
