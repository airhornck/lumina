<!DOCTYPE html>

    <style>
        body {

            line-height: 1.8;
            color: #333;
            background: #fafafa;
        }
        .container {
            background: #fff;

        h1 { font-size: 26px; margin-bottom: 12px; color: #1a1a1a; }
        .tags { margin: 16px 0; }
        .tag {
            display: inline-block;
            background: #f0f0f0;
            padding: 4px 14px;
            border-radius: 16px;
            font-size: 14px;

            padding: 14px 16px;
            border-radius: 8px;
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
        }
        .compliance.warning {
            color: #bf360c;
            background: #fff3e0;

        }

            background: #ffcc80;

        .platform-specs {
            background: #fff8e1;
            padding: 20px;
            border-radius: 10px;
            margin: 24px 0;

        .platform-specs h3 { margin-top: 0; color: #f57c00; font-size: 16px; }
        .spec-section { margin: 14px 0; }
        .spec-section h4 {
            font-size: 14px;
            color: #e65100;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .spec-section ul {
            margin: 0;
            padding-left: 20px;
            font-size: 14px;
            color: #555;
        }
        .spec-section li { margin: 4px 0; }
        .spec-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            margin-top: 8px;
        }
        .spec-table th, .spec-table td {
            text-align: left;
            padding: 8px 12px;
            border-bottom: 1px solid #e0e0e0;
        }
        .spec-table th {
            background: #fff3cd;
            color: #856404;
            font-weight: 600;
            width: 30%;
        }
        .spec-table td { color: #555; }

            border-left: 4px solid #2196f3;
        }

            color: #1565c0;

        .field-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px dashed #bbdefb;
            font-size: 14px;
        }

        .field-label { color: #424242; font-weight: 500; }
        .field-value { color: #1565c0; font-weight: 600; }
        .field-warn { color: #e53935; font-weight: 600; }

        footer {

            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: #999;
            text-align: center;
        }
        .best-time {
            background: #e8eaf6;
            padding: 10px 16px;
            border-radius: 8px;
            margin: 16px 0;
            font-size: 14px;
            color: #3949ab;
            border-left: 4px solid #5c6bc0;
