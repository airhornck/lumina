# Lumina 生产环境 Docker Compose 配置
# 连接现有的宿主机 PostgreSQL，不迁移数据库
#
# 使用方法：
#   1. 复制 .env.example 为 .env.prod，填写实际环境变量
#   2. docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#   3. docker compose -f docker-compose.prod.yml --env-file .env.prod logs -f

services:
  lumina-api:
    image: ${LUMINA_IMAGE:-lumina720:1.0}
    container_name: lumina51
    ports:
      - "${LUMINA_PORT:-8080}:8000"
    env_file:
      - .env.prod
    environment:
      PYTHONUNBUFFERED: 1
      LLM_CONFIG_PATH: /app/infra/config/llm.yaml
      # 以下变量也可在 .env.prod 中设置，此处作为显式兜底
      DATABASE_URL: ${DATABASE_URL}
      CHAT_MEMORY_BACKEND: ${CHAT_MEMORY_BACKEND:-postgres}
      LUMINA_HERMES_MODEL: ${LUMINA_HERMES_MODEL:-deepseek-v4-flash}
      LUMINA_HERMES_PROVIDER: ${LUMINA_HERMES_PROVIDER:-deepseek}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
